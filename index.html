<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wanted Guild · Event Sign Ups</title>
    <meta
      name="description"
      content="Create and track sign ups for Wanted Guild PvX events."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>Wanted Guild</h1>
        <p class="tagline">PvX event sign ups for Throne and Liberty</p>
      </div>
    </header>

    <main class="container layout">
      <section class="panel" aria-labelledby="new-event-heading">
        <h2 id="new-event-heading">Create event</h2>
        <form id="event-form" class="event-form" novalidate>
          <label>
            Title
            <input
              name="title"
              required
              maxlength="80"
              placeholder="Saturday castle siege"
            />
          </label>
          <label>
            Type
            <select name="type" required></select>
          </label>
          <label>
            Starts at
            <input name="startsAt" type="datetime-local" required />
          </label>
          <label>
            Capacity
            <input
              name="capacity"
              type="number"
              min="1"
              max="100"
              value="20"
              required
            />
          </label>
          <p id="event-form-error" class="form-error" role="alert" hidden></p>
          <button type="submit">Create event</button>
        </form>
      </section>

      <section aria-labelledby="events-heading">
        <h2 id="events-heading">Upcoming events</h2>
        <ul id="event-list" class="event-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">Version <span id="app-version"></span></div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
