[project]
name = "wanted-guild-manager"
# Not used for releases: the git tag is the version (see ADR 0008).
version = "0.0.0"
description = "Create and track sign ups for Wanted Guild PvX events in Throne and Liberty."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "granian",
    "litestar",
    "litestar-granian>=0.17.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ansible>=15.0.0",
    "ansible-lint>=26.11.1",
    "anyio>=4.16.0",
    "attrs>=26.1.0",
    "dark-madr",
    "httpx",
    "invoke>=3.0.3",
    "mypy",
    "pre-commit>=4.7.0",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wgm"]

[tool.adr]
dir = "docs/decisions"
template = "madr"
default_status = "proposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --cov=wgm --cov=tasks --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.mypy]
strict = true
files = ["src", "tasks", "tests"]

[tool.ruff]
line-length = 88
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
# Invoke tasks take one argument per command line option.
"tasks/*.py" = ["PLR0913", "PLR0917"]
# Tests compare against literal expected values.
"tests/**/*.py" = ["PLR2004"]
