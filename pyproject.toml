[project]
name = "wanted-guild-manager"
# Not used for releases: the git tag is the version (see ADR 0008).
version = "0.0.0"
description = "Create and track sign ups for Wanted Guild PvX events in Throne and Liberty."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "granian",
    "litestar",
]

[dependency-groups]
dev = [
    "dark-madr",
    "httpx",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wgm"]

[tool.adr]
dir = "docs/decisions"
template = "madr"
default_status = "proposed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wgm --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PL"]
